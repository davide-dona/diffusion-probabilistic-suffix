defaults:
- _self_
kind: masked_diffusion_transformer
name: masked_diffusion_transformer
d_model: 32
embeddings:
  activity_dim: 16
  resource_dim: 32
  feature_dim: 8
encoder:
  num_layers: 4
  num_heads: 8
  feedforward_dim: 128
  dropout: 0.1
decoder:
  num_layers: 4
  num_heads: 8
  feedforward_dim: 128
  dropout: 0.1
  head_hidden_dim: 128
diffusion:
  train_steps: 1000
  sample_steps: 50
  cosine_offset: 0.008
  ddim_eta: 1.0
  continuous_clip: 20.0
loss:
  length_weight: 1.0
  activity_weight: 1.0
  inter_event_time_weight: 1.0
