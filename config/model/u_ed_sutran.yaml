defaults:
- _self_
_target_: src.models.architectures.u_ed_sutran.model.UEDSuTraN
kind: u_ed_sutran
name: u_ed_sutran
d_model: 32
embeddings:
  activity_dim: 32
  resource_dim: 16
  feature_dim: 8
encoder:
  num_layers: 4
  num_heads: 8
  feedforward_dim: 128
  dropout: 0.1
decoder:
  num_layers: 4
  num_heads: 8
  feedforward_dim: 128
  dropout: 0.1
  activity_dropout: 0.3
  head_hidden_dim: 128
uncertainty:
  log_variance_min: -10.0
  log_variance_max: 10.0
  categorical_samples: 20
  validation_seed: ${seed}
