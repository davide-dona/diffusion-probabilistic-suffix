defaults:
- output/default
- dataset: ???
- model: head_sampling_transformer
- training: default
# A multirun first composes without its sweep values, leaving `dataset` missing. Falling back to
# ??? makes Hydra skip the regime there too, instead of failing on the missing interpolation.
- regime: ${oc.select:dataset,???}
- runtime: cuda
- _self_
run_id: ${now:%Y%m%d-%H%M%S-%f}
experiment: null
hydra:
  run:
    dir: ${model_output:train,${data.name},${model._target_},${run_id}}
  sweep:
    dir: outputs/train
    subdir: ${model_subdir:train,${data.name},${model._target_},${run_id}}
