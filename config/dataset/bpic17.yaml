# @package _global_
data:
  name: bpic17
  case_key: case:concept:name
  activity_key: concept:name
  resource_key: org:resource
  timestamp_key: time:timestamp
  separator: ;
  val_split: 0.15
  test_split: 0.2
  split_seed: 42
  max_seq_len_percentile: 98.5
  max_case_duration_percentile: 99.9
  min_observed_duration_percentile: 95
  string_features: []
  event_features:
  - case:LoanGoal
  - case:ApplicationType
  - case:RequestedAmount
  - Action
  - EventOrigin
  - lifecycle:transition
  - FirstWithdrawalAmount
  - NumberOfTerms
  - Accepted
  - MonthlyCost
  - Selected
  - CreditScore
  - OfferedAmount
  - ts_start
  - day_sin
  - day_cos
  - seconds_sin
  - seconds_cos
  log_scaled_features:
  - case:RequestedAmount
  - FirstWithdrawalAmount
  - MonthlyCost
  - OfferedAmount
  - ts_start
  log_scaled_target_inter_event_time: false
declare:
  min_support: 0.05
  min_confidence: 0.99
  max_cardinality: 2
